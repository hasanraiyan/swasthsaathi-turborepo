services:
  - type: web
    name: swasthsaathi-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install -g pnpm && pnpm install --frozen-lockfile && pnpm --filter @repo/contracts build && pnpm --filter api build
    startCommand: pnpm --filter api start:prod
    healthCheckPath: /api
    envVars:
      - key: NODE_VERSION
        value: 20
